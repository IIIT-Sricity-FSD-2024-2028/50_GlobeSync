name: GlobeSync Quality Gate CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality:
    name: Backend Quality Gate (Typecheck, Unit, Integration, Coverage, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: back-end/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Type-Check (tsc --noEmit)
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Run Supertest Integration Tests
        run: npm run test:integration

      - name: Verify Coverage Threshold (>= 80% on core services)
        run: npm run test:cov

      - name: Build NestJS Application
        run: npm run build

  frontend-quality:
    name: Frontend Quality Gate (Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: front-end/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Production Frontend
        run: npm run build

  e2e-quality:
    name: End-to-End Quality Gate (Playwright User Journeys & RBAC)
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd back-end && npm ci && npm run build
          cd ../front-end && npm ci
          npx playwright install --with-deps chromium

      - name: Start Backend API Service
        run: |
          cd back-end
          npm run start:prod &
          sleep 5

      - name: Start Frontend Service
        run: |
          cd front-end
          npm run dev -- --host 127.0.0.1 --port 5173 &
          sleep 5

      - name: Run Playwright E2E Test Suite
        working-directory: front-end
        run: npx playwright test

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front-end/playwright-report/
          retention-days: 14
